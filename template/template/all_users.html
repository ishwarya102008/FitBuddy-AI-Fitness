<!DOCTYPE html>
<html>

<head>

<title>All Users</title>

<style>

body {
    font-family: Arial;
    padding: 30px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid black;
    padding: 10px;
    vertical-align: top;
}

pre {
    white-space: pre-wrap;
}

</style>

</head>

<body>

<h1>FitBuddy - All Users</h1>

<table>

<tr>
<th>User ID</th>
<th>Name</th>
<th>Age</th>
<th>Weight</th>
<th>Goal</th>
<th>Intensity</th>
<th>Original Plan</th>
<th>Updated Plan</th>
</tr>

{% for user in users %}

<tr>

<td>{{ user.user_id }}</td>
<td>{{ user.username }}</td>
<td>{{ user.age }}</td>
<td>{{ user.weight }}</td>
<td>{{ user.goal }}</td>
<td>{{ user.intensity }}</td>

<td>
<pre>{{ user.original_plan }}</pre>
</td>

<td>
<pre>{{ user.updated_plan }}</pre>
</td>

</tr>

{% endfor %}

</table>

</body>

</html>
